    <!-- Main Application Script -->
    <script>
        // Global variables
        let sectionManager;
        let animationEffects;
        let unityGameLoader;

        // Main initialization
        function initializeApp() {
            console.log('Initializing Portfolio Application...');

            try {
                // Initialize section manager
                sectionManager = new SectionManager();

                // Initialize animation effects
                animationEffects = new AnimationEffects();
                console.log('Portfolio application initialized successfully');

            } catch (error) {
                console.error('Failed to initialize application:', error);
            }
        }

        // Initialize everything when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializeApp);
        // Handle window resize
        window.addEventListener('resize', () => {
            console.log('Window resized, updating components...');

            if (sectionManager) {
                sectionManager.handleResize();
            }

            if (animationEffects) {
                animationEffects.handleResize();
            }

            if (unityGameLoader) {
                unityGameLoader.handleResize();
            }
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Page hidden, pausing animations...');

                // Pause animations and intensive processes
                if (animationEffects) {
                    animationEffects.pauseAnimations();
                }

                if (unityGameLoader && unityGameLoader.unityInstance) {
                    // Pause Unity game if available
                    unityGameLoader.pauseGame();
                }

            } else {
                console.log('Page visible, resuming animations...');

                // Resume animations and processes
                if (animationEffects) {
                    animationEffects.resumeAnimations();
                }

                if (unityGameLoader && unityGameLoader.unityInstance) {
                    // Resume Unity game if available
                    unityGameLoader.resumeGame();
                }
            }
        });

        // Handle page unload cleanup
        window.addEventListener('beforeunload', () => {
            console.log('Cleaning up resources...');

            if (animationEffects) {
                animationEffects.cleanup();
            }

            if (unityGameLoader) {
                unityGameLoader.cleanup();
            }
        });
    </script>

    <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top"></button>
</body>
<script>
    // Emergency header fix - add right after <body> tag
    setInterval(() => {
        const header = document.querySelector('header');
        if (header && window.innerWidth <= 768) {
            header.style.cssText = `
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            z-index: 9999 !important;
            background: rgba(11, 41, 27, 0.98) !important;
            transform: translate3d(0, 0, 0) !important;
        `;
        }

        // Ensure scroll button stays properly positioned
        if (scrollBtn && window.innerWidth <= 768) {
            scrollBtn.style.position = 'fixed';
            scrollBtn.style.bottom = '20px';
            scrollBtn.style.right = '20px';
            scrollBtn.style.zIndex = '9998';
        }
    }, 50);
</script>
